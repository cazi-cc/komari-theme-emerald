name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare-sync-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: master
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Merge upstream and validate the review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sync_upstream.py
      - name: Preserve merge diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-sync-diagnostics
          path: ${{ runner.temp }}/upstream-sync/
          if-no-files-found: ignore
          retention-days: 14
