name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '53 3 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-sync-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Merge upstream into a review branch
        run: |
          set -euo pipefail
          git config user.name "cazi-upstream-sync"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream "https://github.com/Tokinx/komari-theme-emerald.git"
          git fetch --no-tags upstream master
          git fetch --no-tags origin master

          if git merge-base --is-ancestor upstream/master origin/master; then
            echo "The fork already contains the current upstream master."
            exit 0
          fi

          git checkout -B sync/upstream-master origin/master
          git merge --no-edit upstream/master
          bun install --frozen-lockfile
          bun run build
          git push --force-with-lease origin sync/upstream-master

      - name: Create or update the review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/master origin/master; then
            exit 0
          fi
          if gh pr view sync/upstream-master --json number >/dev/null 2>&1; then
            gh pr edit sync/upstream-master \
              --title "chore: sync Tokinx/komari-theme-emerald master" \
              --body "Automated upstream merge. Keep the rolling v1.0.0 release policy and review Cazi settings, privacy and analysis pages before merging."
          else
            gh pr create \
              --base master \
              --head sync/upstream-master \
              --title "chore: sync Tokinx/komari-theme-emerald master" \
              --body "Automated upstream merge. Keep the rolling v1.0.0 release policy and review Cazi settings, privacy and analysis pages before merging."
          fi
