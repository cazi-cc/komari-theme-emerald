name: Rolling v1.0.0 Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: rolling-v1.0.0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: bun run build

      - name: Prepare stable release asset
        run: |
          artifact="$(find . -maxdepth 1 -type f -name 'komari-theme-emerald-build-*.zip' -print -quit)"
          test -n "${artifact}"
          cp "${artifact}" komari-theme-emerald.zip

      - name: Move rolling tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force v1.0.0 "${GITHUB_SHA}"
          git push origin refs/tags/v1.0.0 --force

      - name: Create or update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release edit v1.0.0 \
              --title "Komari Emerald Cazi v1.0.0" \
              --notes-file RELEASE.md \
              --latest
          else
            gh release create v1.0.0 \
              --title "Komari Emerald Cazi v1.0.0" \
              --notes-file RELEASE.md \
              --latest
          fi
          gh release upload v1.0.0 komari-theme-emerald.zip --clobber
